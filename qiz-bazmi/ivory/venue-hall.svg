  <linearGradient id="clothG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffaf1"/><stop offset=".55" stop-color="#f7ecd9"/><stop offset="1" stop-color="#e4d2b2"/>
