    <stop offset=".65" stop-color="#c9a771" stop-opacity="0"/><stop offset="1" stop-color="#b8925c" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffefb"/><stop offset=".45" stop-color="#fff8ea"/><stop offset="1" stop-color="#f6e6c6"/>
